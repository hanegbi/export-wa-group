<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="titlebar">
    <img class="app-icon" src="../../icons/icon48.png" width="22" height="22" alt="" />
    <h1>WhatsApp Group Export</h1>
  </header>
  <div id="status-area"></div>
  <div class="range-row">
    <label class="range-field">
      <span class="range-label">From <span class="range-hint">(blank = now)</span></span>
      <input type="datetime-local" id="range-from" />
    </label>
    <label class="range-field">
      <span class="range-label">To <span class="range-hint">(blank = full history)</span></span>
      <input type="datetime-local" id="range-to" />
    </label>
  </div>
  <h2>Exports</h2>
  <div id="export-list"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
