<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <h1>WhatsApp Group Export</h1>
  <div id="status-area"></div>
  <div class="range-summary">
    <button type="button" id="range-toggle" class="link-btn">Change Date</button>
  </div>
  <div class="range-row" id="range-row" hidden>
    <label class="range-field">
      From
      <input type="datetime-local" id="range-from" />
      <span class="range-hint">blank = now</span>
    </label>
    <label class="range-field">
      To
      <input type="datetime-local" id="range-to" />
      <span class="range-hint">blank = full history</span>
    </label>
  </div>
  <h2>Exports</h2>
  <div id="export-list"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
