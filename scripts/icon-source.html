<!--
  Source for the extension's icons. Renders a 512x512 canvas using two
  Feather Icons (https://feathericons.com, MIT licensed): "message-circle"
  (filled, as the bubble) and "users" (in the group badge).

  To regenerate: open this file in a browser at exactly 512x512 content
  size, screenshot it, then run:
    python scripts/finish-icon.py <path-to-screenshot.png>
-->
<!DOCTYPE html>
<html>
<head>
<style>
  html, body { margin: 0; padding: 0; }
  .icon-canvas {
    width: 512px;
    height: 512px;
    background: linear-gradient(145deg, #34e07a 0%, #1fb757 100%);
    border-radius: 112px;
    position: relative;
    overflow: hidden;
  }
  .bubble {
    position: absolute;
    top: 44%;
    left: 46%;
    transform: translate(-50%, -50%);
    width: 410px;
    height: 410px;
    filter: drop-shadow(0 16px 20px rgba(0, 60, 30, 0.3));
  }
  .bubble svg { width: 100%; height: 100%; display: block; }
  .w-letter {
    position: absolute;
    top: 37%;
    left: 46%;
    transform: translate(-50%, -50%);
    color: #1fb757;
    font-family: Arial, sans-serif;
    font-weight: 800;
    font-size: 202px;
    line-height: 1;
  }
  .group-badge {
    position: absolute;
    right: 20px;
    bottom: 20px;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: #ffffff;
    box-shadow: 0 10px 16px rgba(0, 40, 20, 0.32);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .group-badge svg { width: 62%; height: 62%; display: block; color: #1fb757; }
</style>
</head>
<body>
  <div class="icon-canvas">
    <div class="bubble">
      <svg viewBox="0 0 24 24" fill="#ffffff" stroke="none">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
      </svg>
    </div>
    <div class="w-letter">W</div>
    <div class="group-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
    </div>
  </div>
</body>
</html>
